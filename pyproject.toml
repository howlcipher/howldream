[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "howldream"
version = "0.4.4"
description = "Controlled divergence, hallucination experiments, and evidence-preserving verification."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["howl-provider-core @ git+https://github.com/howlcipher/howl-provider-core.git@e7cdf2c43705f93b69b6120157cbb55817a3a2af", "pydantic>=2.10,<3", "PyYAML>=6.0.2,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=6", "ruff>=0.11", "flake8>=7", "mypy>=1.15", "types-PyYAML", "build>=1.2", "pip-audit>=2.9", "bandit>=1.8", "playwright>=1.50", "jsonschema>=4.20,<5"]

[project.scripts]
howldream = "howldream.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
howldream = ["fixtures/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
files = ["src/howldream"]
check_untyped_defs = true
