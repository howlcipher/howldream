name: Manual evaluation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deterministic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev]'
      - run: howldream benchmark run dreambench --split all --output evaluation-output
      - run: howldream evaluate dreamvalue --output evaluation-output
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: howldream-evaluation
          path: evaluation-output
