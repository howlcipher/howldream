name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip setuptools
      - run: pip install -e '.[dev]'
      - run: ruff format --check src tests scripts
      - run: ruff check src tests scripts
      - run: flake8 src tests --max-line-length=100 --extend-ignore=E203,W503
      - run: mypy
      - run: pytest -q
      - run: howldream benchmark
      - run: howldream validate examples/self_detection.yaml
      - run: howldream run examples/self_detection.yaml
      - run: python -m build
      - run: bandit -r src -ll
      - run: pip-audit --skip-editable
  pages-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/check_site.py
