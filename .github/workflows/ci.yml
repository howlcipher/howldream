name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip setuptools
      - run: pip install -e '.[dev]'
      - run: ruff format --check src tests scripts
      - run: ruff check src tests scripts
      - run: flake8 src tests --max-line-length=100 --extend-ignore=E203,W503
      - run: mypy
      - run: pytest -q
      - name: Fail if schemas/ has drifted from contracts.py
        run: python scripts/generate_schemas.py --check
      - run: howldream benchmark run dreambench --split development
      - run: howldream evaluate dreamvalue --output /tmp/howldream-evaluation
      - run: howldream validate examples/self_detection.yaml
      - run: howldream run examples/self_detection.yaml
      - run: python -m build
      - run: bandit -r src -ll
      - run: pip-audit --skip-editable
  pages-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/check_site.py
  ecosystem-integration:
    # Exercises the real cross-repo import that tests/test_end_to_end_ecosystem.py
    # otherwise falls back from via `except ImportError` when howlcreate isn't
    # installed. Without this job, CI never proves the real module is compatible —
    # only the in-test fallback stub. Pin bumped deliberately, not on every push.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip setuptools
      - run: pip install -e '.[dev]'
      - run: pip install "git+https://github.com/howlcipher/howlcreate.git@6f5f5ab0e90b4b88abe1dd3fa2afe35729c4cb33"
      - name: Confirm real howlcreate import (not the test's fallback stub)
        run: python -c "from howlcreate.engine.candidate_ingestion import develop_candidate; print('real howlcreate.engine.candidate_ingestion import OK')"
      - run: pytest tests/test_end_to_end_ecosystem.py -q
